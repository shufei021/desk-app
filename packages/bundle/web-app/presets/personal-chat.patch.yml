# General-purpose conversations expose image generation without coding or workspace instructions.
- insert:
    - id: preset-personal-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: personal-chat
        name: Personal chat
        description: General chat with optional configured image generation
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful general-purpose assistant. Answer in the user's language. Use the available image generation tool when the user asks you to create an image; distinguish a generated result from a description or a failed request.
              complete: true
              includeRuntimeContext: false
          - id: personal-chat-tools
            name: '@deepseek-ai/dsh-tool-image-generation/chat'
          - id: image-tool
            name: '@deepseek-ai/dsh-tool-image-generation/tool'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
